# ============================================================================
# SOC Lab Docker – Full Stack Configuration
# ============================================================================
#
# Services:
#   elasticsearch  – Data store and search engine
#   kibana         – Web UI for querying and visualization
#   filebeat       – Log shipper (picks up generator output → Elasticsearch)
#   log-generator  – Synthetic event generator (writes JSON logs to volume)
#
# Usage:
#   cp .env.example .env
#   docker-compose up -d
#   Open http://localhost:5601
#
# See docs/SETUP.md for detailed instructions.
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # Elasticsearch – Single-node data store
  # --------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION:-8.11.1}
    container_name: soc-lab-elasticsearch
    environment:
      - discovery.type=single-node
      - cluster.name=${ELASTICSEARCH_CLUSTER_NAME:-soc-lab-cluster}
      - ES_JAVA_OPTS=-Xms${ELASTICSEARCH_HEAP_SIZE:-512m} -Xmx${ELASTICSEARCH_HEAP_SIZE:-512m}
      # Security disabled for lab/development use only
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - soc-lab-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qv '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Kibana – Web UI (Query, Discover, Dashboards)
  # --------------------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION:-8.11.1}
    container_name: soc-lab-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_HOST=${WEB_UI_HOST:-0.0.0.0}
      - SERVER_NAME=soc-lab-kibana
      - TELEMETRY_ENABLED=false
      - TELEMETRY_OPTIN=false
    ports:
      - "${WEB_UI_PORT:-5601}:5601"
    networks:
      - soc-lab-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Filebeat – Ships JSON logs from the shared volume to Elasticsearch
  # --------------------------------------------------------------------------
  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_VERSION:-8.11.1}
    container_name: soc-lab-filebeat
    user: root
    command: filebeat -e -strict.perms=false
    volumes:
      - ./log-aggregator/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./data/logs:/var/log/soc-lab:ro
    networks:
      - soc-lab-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Log Generator – Synthetic event producer
  # --------------------------------------------------------------------------
  log-generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    container_name: soc-lab-log-generator
    environment:
      - LOG_OUTPUT_DIR=/var/log/soc-lab
      - EVENT_RATE=${LOG_GENERATION_RATE:-10}
      - EVENT_TYPES=${EVENT_TYPES:-authentication,web_traffic,process_execution,network,security_alerts}
      - SYNTHETIC_USER_COUNT=${SYNTHETIC_USER_COUNT:-50}
      - SYNTHETIC_HOST_COUNT=${SYNTHETIC_HOST_COUNT:-20}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./data/logs:/var/log/soc-lab
    networks:
      - soc-lab-network
    restart: unless-stopped

# ============================================================================
# Volumes
# ============================================================================
volumes:
  elasticsearch-data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  soc-lab-network:
    driver: bridge
