# ─────────────────────────────────────────────────────────────────────────────
# Variant: Admin Share SMB Scanning
# ─────────────────────────────────────────────────────────────────────────────
title: Admin Share Access via net.exe
id: 8d1c5f30-4a7b-4e9d-b2c6-0f3e8a1d5c92
status: experimental
description: |
  Detects net.exe commands accessing administrative shares (ADMIN$, C$, IPC$),
  which are used by PsExec and similar tools to transfer binaries and establish
  remote service connections during lateral movement operations.
references:
  - https://attack.mitre.org/techniques/T1021/002/
author: SOC Lab Docker
date: 2026-02-27
tags:
  - attack.lateral_movement
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process.name: net.exe
    process.command_line|contains:
      - '\ADMIN$'
      - '\C$'
      - '\IPC$'
  condition: selection
falsepositives:
  - Legitimate admin share mapping by IT staff
  - Software deployment tools using admin shares
fields:
  - process.name
  - process.command_line
  - user.name
  - host.name
level: medium
