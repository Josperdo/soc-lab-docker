# ─────────────────────────────────────────────────────────────────────────────
# Variant: Linux Privilege Escalation via sudo Shell
# ─────────────────────────────────────────────────────────────────────────────
title: Linux Full Shell Escalation via sudo
id: 7b3e9a61-5d2c-4f8b-a1e4-c0d7f3b8e5a2
status: stable
description: |
  Detects high-risk sudo usage that results in an interactive shell as root.
  Commands like "sudo su -", "sudo -s", "sudo bash", and "sudo sh" drop the
  user into a root shell and are rarely needed in production environments.
references:
  - https://attack.mitre.org/techniques/T1548/003/
author: SOC Lab Docker
date: 2026-02-27
tags:
  - attack.privilege_escalation
  - attack.t1548.003
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    process.name: sudo
    process.command_line|contains:
      - 'sudo su'
      - 'sudo -s'
      - 'sudo bash'
      - 'sudo sh'
      - 'sudo /bin/bash'
      - 'sudo /bin/sh'
  condition: selection
falsepositives:
  - System administrators performing authorized maintenance tasks
  - On-call engineers following runbooks that require root shells
fields:
  - process.name
  - process.command_line
  - user.name
  - host.name
level: medium
