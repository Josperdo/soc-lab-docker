# ─────────────────────────────────────────────────────────────────────────────
# Variant: PowerShell Encoded Command (Download Cradle)
# Covers the download cradle step of C2 implant delivery.
# ─────────────────────────────────────────────────────────────────────────────
title: PowerShell Executing Encoded Command or Download Cradle
id: 3f7a2e84-9c5b-4d1f-a8e3-5b0c4d9f2a71
status: stable
description: |
  Detects PowerShell invoked with the -EncodedCommand flag (encoded payload) or
  commands referencing common download cradle patterns (Net.WebClient,
  DownloadString, IEX). These patterns are extensively used by C2 implants and
  initial access payloads to execute code in memory without writing to disk.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1140/
author: SOC Lab Docker
date: 2026-02-27
tags:
  - attack.execution
  - attack.defense_evasion
  - attack.t1059.001
  - attack.t1140
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection_encoded:
    process.name:
      - powershell.exe
      - pwsh.exe
    process.command_line|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-e '
  selection_cradle:
    process.name:
      - powershell.exe
      - pwsh.exe
    process.command_line|contains:
      - 'Net.WebClient'
      - 'DownloadString'
      - 'DownloadFile'
      - 'IEX'
      - 'Invoke-Expression'
      - 'WebRequest'
      - 'curl '
      - 'wget '
  selection_hidden:
    process.name:
      - powershell.exe
      - pwsh.exe
    process.command_line|contains:
      - '-WindowStyle Hidden'
      - '-W Hidden'
      - '-NonInteractive'
      - '-ExecutionPolicy Bypass'
      - '-EP Bypass'
  condition: selection_encoded or selection_cradle or (selection_hidden and 1 of selection_*)
falsepositives:
  - Legitimate PowerShell automation scripts using encoded commands for special
    character handling or cross-version compatibility
  - System management tools (SCCM, Intune) deploying PowerShell payloads
fields:
  - process.name
  - process.command_line
  - process.parent.name
  - user.name
  - host.name
level: high
