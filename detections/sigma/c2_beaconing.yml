# ─────────────────────────────────────────────────────────────────────────────
# Variant: Suspicious Office Document Spawning PowerShell
# Covers the initial access phase of C2 beacon simulation (T1566.001)
# ─────────────────────────────────────────────────────────────────────────────
title: Office Application Spawning PowerShell or cmd.exe
id: 8c1e4f73-5a9b-4d2e-b3c7-6f0a2d8c1e94
status: stable
description: |
  Detects Microsoft Office applications (Word, Excel, Outlook) spawning
  PowerShell or cmd.exe — a primary indicator of macro-based initial access
  via spearphishing attachments. Legitimate Office documents rarely need to
  spawn shells directly.
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1059/001/
author: SOC Lab Docker
date: 2026-02-27
tags:
  - attack.initial_access
  - attack.execution
  - attack.t1566.001
  - attack.t1059.001
  - attack.t1059.003
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process.parent.name:
      - winword.exe
      - excel.exe
      - outlook.exe
      - powerpnt.exe
      - mspub.exe
      - visio.exe
    process.name:
      - cmd.exe
      - powershell.exe
      - pwsh.exe
      - wscript.exe
      - cscript.exe
      - mshta.exe
  condition: selection
falsepositives:
  - Macro-based business automation tools in controlled environments
  - Development/testing workflows involving Office VBA
fields:
  - process.parent.name
  - process.name
  - process.command_line
  - user.name
  - host.name
level: high

