# ─────────────────────────────────────────────────────────────────────────────
# Variant: Known C2/RAT Port Activity
# Higher confidence: these specific ports are commonly used by C2 frameworks.
# ─────────────────────────────────────────────────────────────────────────────
title: Outbound Connection to Known C2 Port
id: 2f8e5b13-9a4c-4d7f-b1e6-3c0d9a8f5b24
status: stable
description: |
  Detects TCP connections to destination ports frequently used by C2 frameworks
  and remote access tools: 4444 (Metasploit default), 1337, 31337, 8443, 8080.
  While 8080 and 8443 have some legitimate use, the others are strong indicators.
references:
  - https://attack.mitre.org/techniques/T1071/001/
  - https://attack.mitre.org/techniques/T1041/
author: SOC Lab Docker
date: 2026-02-27
tags:
  - attack.command_and_control
  - attack.exfiltration
  - attack.t1071.001
  - attack.t1041
logsource:
  category: network_connection
detection:
  selection_high_confidence:
    destination.port:
      - 4444
      - 4445
      - 1337
      - 31337
  selection_medium_confidence:
    destination.port:
      - 8443
      - 8080
  condition: 1 of selection_*
falsepositives:
  - Development environments using non-standard ports for local services
  - Security tools that listen on 4444 (Metasploit listeners in authorized tests)
  - 8080/8443: Proxy servers, development web servers, and some vendor products
fields:
  - source.ip
  - destination.ip
  - destination.port
  - host.name
level: high

