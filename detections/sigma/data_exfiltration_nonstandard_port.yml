# ─────────────────────────────────────────────────────────────────────────────
# Variant: Archive Tool Execution (Data Staging)
# ─────────────────────────────────────────────────────────────────────────────
title: Data Archiving Tool Accessing Sensitive Directories
id: 1e5c8a27-4f3b-4d9e-b6c2-7a0f3e1d8c95
status: stable
description: |
  Detects archiving and compression utilities (7-Zip, WinRAR, tar, zip)
  accessing directories that commonly contain sensitive data, such as
  user document folders or network shares. Data staging before exfiltration
  typically involves archiving files from multiple locations.
references:
  - https://attack.mitre.org/techniques/T1560/001/
  - https://attack.mitre.org/techniques/T1074/001/
author: SOC Lab Docker
date: 2026-02-27
tags:
  - attack.collection
  - attack.t1560.001
  - attack.t1074.001
logsource:
  category: process_creation
detection:
  selection_tool:
    process.name:
      - 7z.exe
      - 7za.exe
      - rar.exe
      - winrar.exe
      - zip.exe
      - tar
  selection_sensitive_path:
    process.command_line|contains:
      - '\Documents'
      - '\Finance'
      - '\HR'
      - '\Confidential'
      - '\Users\'
      - 'C:\Users'
      - '\\fileserver'
  condition: selection_tool and selection_sensitive_path
falsepositives:
  - Legitimate backup agents archiving user data
  - IT-managed compression of audit logs
  - Approved data archival workflows
fields:
  - process.name
  - process.command_line
  - process.parent.name
  - user.name
  - host.name
level: medium

