# ─────────────────────────────────────────────────────────────────────────────
# Variant: certutil.exe Encoding (Defense Evasion)
# certutil.exe is a LOLBin commonly used to encode data before exfiltration.
# ─────────────────────────────────────────────────────────────────────────────
title: certutil.exe Used for Data Encoding
id: 7a3d6f41-2c8e-4b5d-b9a3-1f4e7c0d2a86
status: stable
description: |
  Detects certutil.exe invoked with the -encode or -decode flag to convert
  binary files to Base64. While certutil.exe has legitimate PKI uses,
  encoding arbitrary files (especially archives or executables) is a common
  defense evasion technique used before exfiltration.
references:
  - https://attack.mitre.org/techniques/T1027/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: SOC Lab Docker
date: 2026-02-27
tags:
  - attack.defense_evasion
  - attack.exfiltration
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    process.name: certutil.exe
    process.command_line|contains:
      - '-encode'
      - '-decode'
      - '/encode'
      - '/decode'
  condition: selection
falsepositives:
  - PKI certificate management operations using certutil
  - System administrators using certutil to encode configuration files
fields:
  - process.name
  - process.command_line
  - process.parent.name
  - user.name
  - host.name
level: medium
