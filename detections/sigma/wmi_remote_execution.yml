# ─────────────────────────────────────────────────────────────────────────────
# Variant: WMI Permanent Event Subscription (Persistence)
# Cross-reference with persistence_simulation.sh events
# ─────────────────────────────────────────────────────────────────────────────
title: WMI Permanent Event Subscription Created
id: 9e4a7f52-1c8d-4b3e-a6c9-5f2d0b8e3a71
status: experimental
description: |
  Detects creation of WMI permanent event subscriptions, which consist of
  three objects: __EventFilter, CommandLineEventConsumer, and
  __FilterToConsumerBinding. Attackers use this mechanism to achieve
  event-triggered persistent execution that survives reboots.
references:
  - https://attack.mitre.org/techniques/T1546/003/
author: SOC Lab Docker
date: 2026-02-27
tags:
  - attack.persistence
  - attack.t1546.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_mofcomp:
    process.name: mofcomp.exe
  selection_wmic_subscription:
    process.name: wmic.exe
    process.command_line|contains: '/namespace:\\root\subscription'
  condition: 1 of selection_*
falsepositives:
  - Legitimate software using WMI subscriptions for monitoring (rare)
  - WMI provider installation by software packages
fields:
  - process.name
  - process.command_line
  - process.parent.name
  - user.name
  - host.name
level: high
